[project]
name = "oversight"
version = "0.1.0"
description = "Can a stronger model (Bob) make a weak judge more accurate on GPQA without giving a verdict?"
authors = [
    { name = "Somaxsoma", email = "nsomasekhar10@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
oversight = "oversight.run:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
kaggle = [
    "cryptography",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
