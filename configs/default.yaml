# Anthropic API models. Set ANTHROPIC_API_KEY before you run.
data:
  source: gpqa_diamond
  csv_path: null
  limit_questions: null
  seed: 0
models:
  alice:
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 16000
  bob:
    model: claude-opus-5-5
    effort: medium
    max_tokens: 16000
  judge:
    model: claude-haiku-5-5
    effort: medium
    max_tokens: 8000
  leak_checker:
    model: claude-haiku-5-5
    effort: low
    max_tokens: 4000
alice:
  samples_per_question: 3
  balance: true
bob:
  strategy: v1_critique
  max_regenerations: 1
  use_llm_leak_check: true
controls:
  bob_alone: true
analysis:
  n_bootstrap: 2000
  seed: 0
run:
  workers: 8
  cache_dir: cache
  out_dir: results
