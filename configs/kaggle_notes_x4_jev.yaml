# Kaggle. Not run yet. Judge gemma3:12b, Bob qwen3:32b.
# Bob writes verdict-free notes. He sees his own private solve-x4 working.
# A leak audit measures if the notes reveal his verdict.
alice:
  balance: true
  samples_per_question: 3
analysis:
  n_bootstrap: 2000
  seed: 0
